<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/crosseroads-emblem.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4a2373" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      prerender:head:start

      Everything between these two markers is replaced, per route, by
      scripts/prerender.mjs during the build, so that a link to any page shares
      with that page's own title, description and card rather than the
      homepage's. Social crawlers never run JavaScript, so this markup is the
      only thing they see. What is written here by hand is the homepage set,
      which is also what `npm run dev` serves, since prerendering is a build
      step. The copy itself lives in src/data/page-meta.ts — edit it there.
    -->
    <title>CrosseRoads — Guidance • Support • Opportunity</title>
    <meta
      name="description"
      content="Empowering single parents and families to navigate the path from high school to college and beyond."
    />
    <link rel="canonical" href="https://crosseroads.com/" />
    <meta property="og:title" content="CrosseRoads — Guidance • Support • Opportunity" />
    <meta
      property="og:description"
      content="Empowering single parents and families to navigate the path from high school to college and beyond."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crosseroads.com/" />
    <meta property="og:site_name" content="CrosseRoads" />
    <meta property="og:image" content="https://crosseroads.com/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CrosseRoads — Guidance • Support • Opportunity" />
    <meta
      name="twitter:description"
      content="Empowering single parents and families to navigate the path from high school to college and beyond."
    />
    <meta name="twitter:image" content="https://crosseroads.com/og-card.jpg" />
    <!-- prerender:head:end -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="CrosseRoads Guides"
      href="/guides.xml"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
